[project]
name = "local-ai-server"
version = "0.2.0"
description = "OpenAI-compatible local AI gateway with bearer auth, structured logging, and hot-reload (v0.2.0)."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "CC-BY-NC-SA-4.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "starlette<1.0",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
    "watchfiles>=0.24",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that require a running Ollama process",
]
filterwarnings = [
    "error",
    # httpx emits DeprecationWarning on Python 3.13 for some defaults;
    # tolerate them rather than fail the whole suite on a third-party warning.
    "default::DeprecationWarning:httpx.*",
    # sqlite3.connect() context manager commits/rolls back but does not close
    # the connection on Python 3.13; the connection closes at GC time.
    # This ResourceWarning comes from app/auth.py's per-call connection
    # pattern and surfaces as PytestUnraisableExceptionWarning in Python 3.13.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
